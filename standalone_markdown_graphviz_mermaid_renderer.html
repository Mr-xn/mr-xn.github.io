<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Industrial Markdown Renderer (Graphviz Stable + Mermaid)</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;
      background: #f6f8fa;
    }

    .toolbar {
      position: sticky;
      top: 0;
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 10;
    }

    button {
      padding: 6px 12px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      border-radius: 6px;
    }

    button:hover { background: #f3f3f3; }

    #editor {
      width: 100%;
      height: 220px;
      font-family: monospace;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ddd;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      padding: 20px;
    }

    .graphviz {
      text-align: center;
      margin: 16px 0;
      overflow: auto;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 8px;
      min-height: 40px;
    }

    .mermaid {
      text-align: center;
      margin: 16px 0;
    }

    svg {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

<div class="toolbar">
  <button id="renderBtn">Render</button>
  <button id="exportBtn">Export HTML</button>
  <button id="exportPdfBtn">Export PDF</button>
  <span id="status"></span>
</div>

<div class="container">
  <textarea id="editor">
# Industrial Graphviz Stable Renderer

## Mermaid
```mermaid
flowchart TD
A --> B --> C
```

## Graphviz A
```dot
digraph G {
  rankdir=LR;
  A -> B -> C -> D;
  A -> D;
}
```

## Graphviz B
```dot
digraph {
  node [shape=box];
  X -> Y -> Z;
  X -> Z;
}
```

## Code

```php
<=phpinfo();
```

  </textarea>

  <div id="preview" class="markdown-body"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/dompdf.js@latest/dist/dompdf.min.js"></script>
<script type="module">
import MarkdownIt from "https://cdn.jsdelivr.net/npm/markdown-it@14/+esm"
import hljs from "https://cdn.jsdelivr.net/npm/highlight.js@11/+esm"
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/+esm"
import { instance } from "https://cdn.jsdelivr.net/npm/@viz-js/viz@3/+esm"

const md = new MarkdownIt({
  html: true,
  highlight: (str, lang) => {
    try {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(str, { language: lang }).value
      }
    } catch {}
    return hljs.highlightAuto(str).value
  }
})

mermaid.initialize({ startOnLoad: false })

const cache = new Map()
let viz = null

// ---------- Shared helpers ----------
function getTimestamp() {
  const now = new Date()
  return now.getFullYear() +
    String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0") + "_" +
    String(now.getHours()).padStart(2, "0") +
    String(now.getMinutes()).padStart(2, "0") +
    String(now.getSeconds()).padStart(2, "0")
}

function downloadBlob(blob, filename) {
  const a = document.createElement("a")
  a.href = URL.createObjectURL(blob)
  a.download = filename
  a.click()
  // Delay revocation to ensure the browser has a chance to start the download
  setTimeout(() => URL.revokeObjectURL(a.href), 10000)
}

// ---------- Graphviz Stable Normalizer ----------
function safeDecode(str) {
  try {
    return decodeURIComponent(escape(atob(str)))
  } catch {
    return str
  }
}

async function renderGraphvizNode(node) {
  const key = node.dataset.key

  if (cache.has(key)) {
    node.innerHTML = cache.get(key)
    return
  }

  try {
    const dot = safeDecode(key)

    if (!viz) viz = await instance()

    const svgEl = await viz.renderSVGElement(dot)

    node.innerHTML = ""
    node.appendChild(svgEl)

    cache.set(key, node.innerHTML || node.outerHTML)

    enhanceSVG(node)

  } catch (e) {
    node.innerHTML = `<pre style='color:red'>Graphviz Error:\n${e}</pre>`
  }
}

function enhanceSVG(container) {
  const svg = container.querySelector("svg")
  if (!svg) return

  // lightweight interaction layer
  svg.querySelectorAll("g.node").forEach(n => {
    n.style.cursor = "pointer"

    n.addEventListener("mouseenter", () => {
      n.style.opacity = "0.6"
    })

    n.addEventListener("mouseleave", () => {
      n.style.opacity = "1"
    })

    n.addEventListener("click", () => {
      n.style.transform = "scale(1.05)"
      setTimeout(() => n.style.transform = "scale(1)", 120)
    })
  })
}

// ---------- Markdown Renderer ----------
md.renderer.rules.fence = (tokens, idx) => {
  const token = tokens[idx]
  const lang = token.info.trim()
  const code = token.content

  if (lang === "mermaid") {
    return `<div class='mermaid'>${code}</div>`
  }

  if (lang === "dot" || lang === "graphviz") {
    const key = btoa(unescape(encodeURIComponent(code)))
    return `<div class='graphviz' data-key='${key}'>rendering graphviz...</div>`
  }

  return `<pre><code>${hljs.highlightAuto(code).value}</code></pre>`
}

const editor = document.getElementById("editor")
const preview = document.getElementById("preview")
const status = document.getElementById("status")

async function render() {
  status.textContent = "Rendering..."

  preview.innerHTML = md.render(editor.value)

  await mermaid.run({ nodes: preview.querySelectorAll(".mermaid") })

  const nodes = [...preview.querySelectorAll(".graphviz")]

  // ---------- sequential + safe rendering ----------
  for (const n of nodes) {
    await renderGraphvizNode(n)
  }

  status.textContent = "Done"
}

document.getElementById("renderBtn").onclick = render

document.getElementById("exportBtn").onclick = async () => {
  status.textContent = "Exporting..."

  try {
    // Clone document to avoid modifying original
    const clone = document.documentElement.cloneNode(true)

    // Remove script tags (no longer needed after render)
    clone.querySelectorAll("script").forEach(s => s.remove())

    // Remove toolbar (editor not needed in export)
    clone.querySelector(".toolbar")?.remove()
    clone.querySelector("#editor")?.remove()

    // Inline external CSS
    const links = clone.querySelectorAll('link[rel="stylesheet"]')
    for (const link of links) {
      const href = link.getAttribute("href")
      if (!href) continue

      try {
        const resp = await fetch(href)
        const css = await resp.text()
        const style = document.createElement("style")
        style.textContent = css
        link.replaceWith(style)
      } catch {
        // Keep original link if fetch fails
      }
    }

    const defaultName = `export_${getTimestamp()}.html`
    const filename = prompt("Export filename:", defaultName)
    if (filename === null) {
      status.textContent = "Cancelled"
      return
    }

    const blob = new Blob([
      "<!DOCTYPE html>\n" + clone.outerHTML
    ], { type: "text/html;charset=utf-8" })

    downloadBlob(blob, filename || defaultName)
    status.textContent = "Exported"
  } catch (e) {
    status.textContent = "Export failed: " + e.message
  }
}

document.getElementById("exportPdfBtn").onclick = async () => {
  // Guard: ensure the library loaded and exposes the expected global
  if (typeof window.dompdf !== "function") {
    status.textContent = "PDF export unavailable: dompdf.js failed to load"
    return
  }

  const defaultName = `export_${getTimestamp()}.pdf`
  const filename = prompt("Export PDF filename:", defaultName)
  if (filename === null) {
    status.textContent = "Cancelled"
    return
  }

  status.textContent = "Generating PDF..."

  try {
    const blob = await window.dompdf(preview, {
      format: "a4",
      pagination: true,
      onProgress(progress) {
        if (progress.stage === "rendering" && progress.currentPage && progress.totalPages) {
          status.textContent = `Generating PDF: page ${progress.currentPage}/${progress.totalPages}`
        } else if (progress.stage) {
          status.textContent = `Generating PDF: ${progress.stage}...`
        }
      }
    })

    downloadBlob(blob, filename || defaultName)
    status.textContent = "PDF exported"
  } catch (e) {
    status.textContent = "PDF export failed: " + e.message
  }
}

render()
</script>
