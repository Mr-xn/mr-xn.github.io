<script src="https://cdn.jsdelivr.net/npm/dompdf.js@1.3.1/dist/dompdf.min.js"></script>
<script type="module">
import MarkdownIt from "https://cdn.jsdelivr.net/npm/markdown-it@14/+esm"
import hljs from "https://cdn.jsdelivr.net/npm/highlight.js@11/+esm"
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/+esm"
import { instance } from "https://cdn.jsdelivr.net/npm/@viz-js/viz@3/+esm"

const md = new MarkdownIt({
  html: true,
  highlight: (str, lang) => {
    try {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(str, { language: lang }).value
      }
    } catch {}
    return hljs.highlightAuto(str).value
  }
})

mermaid.initialize({ startOnLoad: false })

const cache = new Map()
let viz = null
let chineseFontBytesPromise = null

const CHINESE_FONT_URL = new URL(
  "./fonts/SourceHanSansSC-Regular.ttf",
  document.baseURI
).href

async function loadChineseFontBytes() {
  if (!chineseFontBytesPromise) {
    chineseFontBytesPromise = fetch(CHINESE_FONT_URL)
      .then(response => {
        if (!response.ok) {
          throw new Error(
            `Chinese font loading failed: ${response.status} ${response.statusText}`
          )
        }
        return response.arrayBuffer()
      })
      .then(buffer => new Uint8Array(buffer))
      .catch(err => {
        chineseFontBytesPromise = null
        throw err
      })
  }
  return chineseFontBytesPromise
}

function blobToDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader()
    reader.onload = () => resolve(reader.result)
    reader.onerror = () => reject(reader.error)
    reader.readAsDataURL(blob)
  })
}

function waitForImage(img) {
  if (img.complete && img.naturalWidth > 0) {
    return Promise.resolve()
  }
  return new Promise(resolve => {
    img.addEventListener("load", resolve, { once: true })
    img.addEventListener("error", resolve, { once: true })
  })
}

async function prepareImages(root) {
  const images = [...root.querySelectorAll("img")]

  await Promise.all(images.map(async img => {
    const source = img.getAttribute("src")
    if (!source) return

    // Data URL and Blob URL do not need to be fetched again
    if (source.startsWith("data:") || source.startsWith("blob:")) {
      await waitForImage(img)
      return
    }

    let absoluteURL
    try {
      absoluteURL = new URL(source, document.baseURI).href
    } catch {
      await waitForImage(img)
      return
    }

    // crossOrigin must be set before reassigning src
    img.crossOrigin = "anonymous"

    try {
      const response = await fetch(absoluteURL, {
        mode: "cors",
        credentials: "omit",
        cache: "force-cache"
      })
      if (!response.ok) {
        throw new Error(`${response.status} ${response.statusText}`)
      }
      const blob = await response.blob()
      img.src = await blobToDataURL(blob)
    } catch (err) {
      // If the remote server does not allow CORS, leave the original URL.
      // This is a browser security restriction, not a bug.
      console.warn(
        "Could not inline image as data URL (CORS or network error).",
        "The source server must send Access-Control-Allow-Origin to allow cross-origin fetch.",
        "Original URL preserved:", absoluteURL, err
      )
      img.src = absoluteURL
    }

    await waitForImage(img)
  }))
}

async function preparePreviewForPDF() {
  // Wait for browser-side font/layout readiness
  if (document.fonts?.ready) {
    await document.fonts.ready
  }
  await prepareImages(preview)
}

// ---------- Shared helpers ----------
function getTimestamp() {
  const now = new Date()
  return now.getFullYear() +
    String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0") + "_" +
    String(now.getHours()).padStart(2, "0") +
    String(now.getMinutes()).padStart(2, "0") +
    String(now.getSeconds()).padStart(2, "0")
}

function downloadBlob(blob, filename) {
  const a = document.createElement("a")
  a.href = URL.createObjectURL(blob)
  a.download = filename
  a.click()
  // Delay revocation to ensure the browser has a chance to start the download
  setTimeout(() => URL.revokeObjectURL(a.href), 10000)
}

// ---------- Graphviz Stable Normalizer ----------
function safeDecode(str) {
  try {
    return decodeURIComponent(escape(atob(str)))
  } catch {
    return str
  }
}

async function renderGraphvizNode(node) {
  const key = node.dataset.key

  if (cache.has(key)) {
    node.innerHTML = cache.get(key)
    return
  }

  try {
    const dot = safeDecode(key)

    if (!viz) viz = await instance()

    const svgEl = await viz.renderSVGElement(dot)

    node.innerHTML = ""
    node.appendChild(svgEl)

    cache.set(key, node.innerHTML || node.outerHTML)

    enhanceSVG(node)

  } catch (e) {
    node.innerHTML = `<pre style='color:red'>Graphviz Error:\n${e}</pre>`
  }
}

function enhanceSVG(container) {
  const svg = container.querySelector("svg")
  if (!svg) return

  // lightweight interaction layer
  svg.querySelectorAll("g.node").forEach(n => {
    n.style.cursor = "pointer"

    n.addEventListener("mouseenter", () => {
      n.style.opacity = "0.6"
    })

    n.addEventListener("mouseleave", () => {
      n.style.opacity = "1"
    })

    n.addEventListener("click", () => {
      n.style.transform = "scale(1.05)"
      setTimeout(() => n.style.transform = "scale(1)", 120)
    })
  })
}

// ---------- Markdown Renderer ----------
md.renderer.rules.fence = (tokens, idx) => {
  const token = tokens[idx]
  const lang = token.info.trim()
  const code = token.content

  if (lang === "mermaid") {
    return `<div class='mermaid'>${code}</div>`
  }

  if (lang === "dot" || lang === "graphviz") {
    const key = btoa(unescape(encodeURIComponent(code)))
    return `<div class='graphviz' data-key='${key}'>rendering graphviz...</div>`
  }

  return `<pre><code>${hljs.highlightAuto(code).value}</code></pre>`
}

const editor = document.getElementById("editor")
const preview = document.getElementById("preview")
const status = document.getElementById("status")

async function render() {
  status.textContent = "Rendering..."

  preview.innerHTML = md.render(editor.value)

  await mermaid.run({ nodes: preview.querySelectorAll(".mermaid") })

  const nodes = [...preview.querySelectorAll(".graphviz")]

  // ---------- sequential + safe rendering ----------
  for (const n of nodes) {
    await renderGraphvizNode(n)
  }

  // Prepare images for preview (also improves PDF export readiness)
  await prepareImages(preview)

  status.textContent = "Done"
}

document.getElementById("renderBtn").onclick = render

document.getElementById("exportBtn").onclick = async () => {
  status.textContent = "Exporting..."

  try {
    // Clone document to avoid modifying original
    const clone = document.documentElement.cloneNode(true)

    // Remove script tags (no longer needed after render)
    clone.querySelectorAll("script").forEach(s => s.remove())

    // Remove toolbar (editor not needed in export)
    clone.querySelector(".toolbar")?.remove()
    clone.querySelector("#editor")?.remove()

    // Inline external CSS
    const links = clone.querySelectorAll('link[rel="stylesheet"]')
    for (const link of links) {
      const href = link.getAttribute("href")
      if (!href) continue

      try {
        const resp = await fetch(href)
        const css = await resp.text()
        const style = document.createElement("style")
        style.textContent = css
        link.replaceWith(style)
      } catch {
        // Keep original link if fetch fails
      }
    }

    const defaultName = `export_${getTimestamp()}.html`
    const filename = prompt("Export filename:", defaultName)
    if (filename === null) {
      status.textContent = "Cancelled"
      return
    }

    const blob = new Blob([
      "<!DOCTYPE html>\n" + clone.outerHTML
    ], { type: "text/html;charset=utf-8" })

    downloadBlob(blob, filename || defaultName)
    status.textContent = "Exported"
  } catch (e) {
    status.textContent = "Export failed: " + e.message
  }
}

document.getElementById("exportPdfBtn").onclick = async () => {
  // Guard: ensure the library loaded and exposes the expected global
  if (typeof window.dompdf !== "function") {
    status.textContent = "PDF export unavailable: dompdf.js failed to load"
    return
  }

  const defaultName = `export_${getTimestamp()}.pdf`
  const filename = prompt("Export PDF filename:", defaultName)
  if (filename === null) {
    status.textContent = "Cancelled"
    return
  }

  status.textContent = "Generating PDF..."

  try {
    let fontBytes
    try {
      fontBytes = await loadChineseFontBytes()
    } catch (fontErr) {
      console.warn("Chinese font load failed, PDF may show garbled text:", fontErr)
      status.textContent = "Warning: Chinese font unavailable – " + fontErr.message
      // Brief pause so the user can read the warning before export continues
      await new Promise(r => setTimeout(r, 1500))
    }

    await preparePreviewForPDF()

    const pdfOptions = {
      format: "a4",
      pagination: true,
      onProgress(progress) {
        if (progress.stage === "rendering" && progress.currentPage && progress.totalPages) {
          status.textContent = `Generating PDF: page ${progress.currentPage}/${progress.totalPages}`
        } else if (progress.stage) {
          status.textContent = `Generating PDF: ${progress.stage}...`
        }
      }
    }

    if (fontBytes) {
      pdfOptions.fontConfig = {
        fontFamily: "SourceHanSansSC-Regular",
        fontBytes,
        fontStyle: "normal",
        fontWeight: 400
      }
    }

    const blob = await window.dompdf(preview, pdfOptions)

    downloadBlob(blob, filename || defaultName)
    status.textContent = "PDF exported"
  } catch (e) {
    status.textContent = "PDF export failed: " + e.message
  }
}

render()
</script>
